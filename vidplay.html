<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Videydotco - Play</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #ffffff;
        --text: #0f172a;
        --line: #e2e8f0;
        --btn: #111827;
        --btnText: #ffffff;
      }

      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* HEADER */
      .appbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
      }
      .bar-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        padding: 10px 16px;
      }
      .brand {
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 18px;
      }
      .logo {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: #111827;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 14px;
      }

      /* PLAYER AREA */
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 16px;
      }
      .player-container {
        position: relative;
        width: clamp(240px, 92vw, 400px);
        aspect-ratio: 9/16;
        background: #000;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* TOMBOL PLAY TENGAH */
      #play-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s ease;
      }
      #play-overlay:hover {
        background: rgba(0, 0, 0, 0.1);
      }

      .play-circle {
        width: 85px;
        height: 85px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        border: 2px solid #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
      }
      #play-overlay:active .play-circle {
        transform: scale(0.9);
      }

      /* CTA BUTTON */
      .tg-box {
        width: 100%;
        max-width: 400px;
        margin-top: 25px;
      }
      .tg-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #3b82f6;
        color: #fff;
        text-decoration: none;
        border-radius: 16px;
        font-weight: 700;
        font-size: 15px;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }
    </style>
  </head>

  <body>
    <header class="appbar">
      <div class="bar-inner">
        <div class="brand">
          <span class="logo">V</span
          ><span>vldey<span style="color: #3b82f6">.co</span></span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <div class="player-container">
        <video id="video-player" playsinline>
          <source src="https://cdn2.videy.co/GQNleLmh1.mp4" type="video/mp4" />
        </video>

        <div id="play-overlay">
          <div class="play-circle">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="white">
              <path d="M8 5v14l11-7z" />
            </svg>
          </div>
        </div>
      </div>

      <div class="tg-box">
        <a href="https://t.me/Videyy0" target="_blank" class="tg-btn"
          >Join Grup Telegram</a
        >
      </div>
    </main>

    <script>
      /* ================== KONFIGURASI ================== */
      const SMARTLINK =
        "https://www.profitablecpmratenetwork.com/rjhfn6nph3?key=f64b5b7868ef11016270bcd7691d2917";
      const JEDA_JAM = 1;
      /* ================================================= */

      const player = document.getElementById("video-player");
      const overlay = document.getElementById("play-overlay");

      function checkCooldown() {
        const lastClick = localStorage.getItem("last_play_click");
        if (lastClick) {
          const diff = Date.now() - parseInt(lastClick);
          if (diff < JEDA_JAM * 60 * 60 * 1000) {
            showVideoDirectly();
            return true;
          }
        }
        return false;
      }

      function showVideoDirectly() {
        overlay.style.display = "none";
        player.setAttribute("controls", "true");
      }

      // Cek saat buka halaman
      checkCooldown();

      overlay.addEventListener("click", function () {
        // Simpan waktu klik
        localStorage.setItem("last_play_click", Date.now().toString());

        // Buka Iklan
        window.open(SMARTLINK, "_blank");

        // Buka & Mainkan Video
        showVideoDirectly();
        player.play();
      });
    </script>
  </body>
</html>
