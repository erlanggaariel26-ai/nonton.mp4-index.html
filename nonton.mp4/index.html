<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VidPlay — Streaming HD Gratis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    /* CSS OPTIMIZED FOR ADS & MOBILE */
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--bg:#050508;--surface:#101018;--border:#1f1f2e;--text:#f0f0f0;--accent:#3b82f6;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden}

    nav{position:sticky;top:0;z-index:1000;background:rgba(5,5,8,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:15px;text-align:center;}
    .nav-logo{font-weight:800;font-size:1.4rem;text-transform:uppercase;letter-spacing:-1px}
    .nav-logo span{color:var(--accent)}

    .main{max-width:1100px;margin:0 auto;padding:12px;display:grid;grid-template-columns:1fr 320px;gap:20px;}
    @media(max-width:900px){ .main{grid-template-columns:1fr;} }

    /* PLAYER AREA */
    .player-wrap{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;width:100%;}
    video{width:100%;height:100%;display:block;object-fit:contain}

    /* POPUP OVERLAY (TANPA TOMBOL X) */
    #popupOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.98);display:flex;align-items:center;justify-content:center;z-index:99999;}
    #popupBox{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:min(350px,90vw);padding:20px;text-align:center;}

    /* GRID PLAYLIST */
    .section-title{font-size:1rem;font-weight:700;margin:20px 0 10px;padding-left:10px;border-left:3px solid var(--accent)}
    .video-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:12px;}
    @media(min-width:600px){ .video-grid{grid-template-columns:repeat(3, 1fr);} }

    .card{background:var(--surface);border-radius:10px;overflow:hidden;border:1px solid var(--border);cursor:pointer}
    .thumb-wrap{aspect-ratio:16/9;background:#000;position:relative;overflow:hidden}
    .thumb-wrap video{width:100%;height:100%;object-fit:cover;opacity:0.8}
    .card-info{padding:10px}
    .card-title{font-size:0.85rem;font-weight:600;line-height:1.4;}

    /* MIDROLL OVERLAY */
    #midrollOverlay{position:absolute;inset:0;background:rgba(0,0,0,0.95);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
    .hidden{display:none !important}
    .btn-continue{background:var(--accent);color:#fff;border:none;padding:14px 28px;border-radius:8px;font-weight:700;margin-top:15px;cursor:pointer;font-size:1rem;box-shadow:0 0 15px rgba(59, 130, 246, 0.5);}
</style>
</head>
<body>

<div id="popupOverlay">
    <div id="popupBox">
        <p style="font-size:10px;color:#64748b;margin-bottom:12px;letter-spacing:1px">MEMUAT SERVER HD...</p>
        <div style="min-height:250px; background:#000; border-radius:8px; display:flex; align-items:center; justify-content:center; overflow:hidden;">
            <script type="text/javascript">
                atOptions = { 'key' : '5587dc9d7bd7fe1a092dd063f078236e', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/5587dc9d7bd7fe1a092dd063f078236e/invoke.js"></script>
        </div>
        <p style="margin-top:20px; font-size:14px;">Video akan diputar dalam <span id="sec" style="color:var(--accent); font-weight:800;">5</span> detik</p>
    </div>
</div>

<nav><div class="nav-logo">VID<span>PLAY</span></div></nav>

<div class="main">
    <div class="content-left">
        <div class="player-wrap">
            <video id="mainVid" controls>
                <source id="vidSrc" src="https://cdn2.videy.co/83eHW7VY1.mp4" type="video/mp4">
            </video>

            <div id="midrollOverlay" class="hidden">
                <p style="font-weight:bold; color:white; font-size:1.1rem; margin-bottom:5px;">IKLAN SPONSOR</p>
                <p style="color:#64748b; font-size:0.8rem; margin-bottom:15px;">Klik tombol di bawah untuk melanjutkan video</p>
                
                <div style="margin:10px 0; min-height:250px; width:300px; background:#000; border-radius:8px;">
                    <script async="async" data-cfasync="false" src="https://pl29122188.profitablecpmratenetwork.com/ba3a9b5f88598e3d66f38ec2b3506a15/invoke.js"></script>
                    <div id="container-ba3a9b5f88598e3d66f38ec2b3506a15"></div>
                </div>

                <button class="btn-continue" onclick="handleMidrollClick()">Lanjutkan Menonton</button>
            </div>
        </div>

        <div style="background:var(--surface); padding:15px; border-radius:12px; margin-top:15px; border:1px solid var(--border)">
            <h1 id="vTitle" style="font-size:1.1rem">🎬 Viral Terbaru HD</h1>
            <p style="color:#64748b; font-size:0.8rem; margin-top:5px">Server Utama • Kualitas 1080p</p>
        </div>

        <div class="section-title">Nonton Juga Video Ini</div>
        <div class="video-grid" id="gridV"></div>
    </div>

    <div class="sidebar">
        <div style="background:var(--surface); padding:15px; border-radius:12px; text-align:center; position:sticky; top:80px; border:1px solid var(--border)">
            <p style="font-size:10px; color:#64748b; margin-bottom:10px">SPONSORED AD</p>
            <script type="text/javascript">
                atOptions = { 'key' : '5587dc9d7bd7fe1a092dd063f078236e', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/5587dc9d7bd7fe1a092dd063f078236e/invoke.js"></script>
        </div>
    </div>
</div>

<script>
// LINK TUJUAN (SMARTLINK ANDA)
const SMARTLINK = "https://omg10.com/4/10997217";

const playlist = [
    {t:'Viral omek terbaru', s:'https://cdn2.videy.co/nUcmf2PL1.mp4'},
    {t:'Asian amateur 1', s:'https://cdn2.videy.co/dcNX5HvY1.mp4'},
    {t:'Asian amateur 2', s:'https://cdn2.videy.co/yPCZuCbG1.mp4'},
    {t:'Asian amateur 3', s:'https://cdn2.videy.co/zYNf8thb1.mp4'},
    {t:'Asian amateur 4', s:'https://cdn2.videy.co/J4g20h9P1.mp4'},
    {t:'Asian amateur 5', s:'https://cdn2.videy.co/OcecWPem1.mp4'},
    {t:'Asian amateur 6', s:'https://cdn2.videy.co/9ILaoDAd1.mp4'},
    {t:'Asian amateur 7', s:'https://cdn2.videy.co/yrY2QxqP1.mp4'},
    {t:'Asian amateur 8', s:'https://cdn2.videy.co/IEPIoJ7H1.mp4'},
    {t:'Asian amateur 9', s:'https://cdn2.videy.co/83eHW7VY1.mp4'},
];

const mainVid = document.getElementById('mainVid');
let midShown = false;

function init() {
    // Generate Playlist dengan Thumbnail Otomatis dari frame video
    const container = document.getElementById('gridV');
    container.innerHTML = playlist.map((v, i) => `
        <div class="card" onclick="changeVideo(${i})">
            <div class="thumb-wrap">
                <video preload="metadata" muted>
                    <source src="${v.s}#t=1" type="video/mp4">
                </video>
            </div>
            <div class="card-info">
                <div class="card-title">${v.t}</div>
            </div>
        </div>
    `).join('');

    // Timer Penutupan Otomatis Popup Awal (5 Detik)
    let count = 5;
    const secDisplay = document.getElementById('sec');
    const countdown = setInterval(() => {
        count--;
        if (secDisplay) secDisplay.innerText = count;
        if (count <= 0) {
            clearInterval(countdown);
            document.getElementById('popupOverlay').style.display = 'none';
            mainVid.play();
        }
    }, 1000);
}

function changeVideo(i) {
    const v = playlist[i];
    document.getElementById('vidSrc').src = v.s;
    document.getElementById('vTitle').innerText = "🎬 " + v.t;
    mainVid.load();
    mainVid.play();
    midShown = false;
    window.scrollTo({top:0, behavior:'smooth'});
}

// Deteksi waktu video 30% untuk memicu iklan
mainVid.addEventListener('timeupdate', () => {
    if(!midShown && mainVid.duration > 0 && (mainVid.currentTime / mainVid.duration) >= 0.3) {
        midShown = true;
        mainVid.pause();
        document.getElementById('midrollOverlay').classList.remove('hidden');
    }
});

// Fungsi saat tombol "Lanjutkan Menonton" diklik
function handleMidrollClick() {
    // Membuka Smartlink Anda di tab baru
    window.open(SMARTLINK, '_blank');
    
    // Menutup overlay iklan dan melanjutkan video
    document.getElementById('midrollOverlay').classList.add('hidden');
    mainVid.play();
}

window.onload = init;
</script>
</body>
</html>
