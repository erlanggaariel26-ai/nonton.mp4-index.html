<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NontonYuk — Streaming HD</title>

<script src="https://pl29122947.profitablecpmratenetwork.com/21/8f/25/218f25eb8a766774d4f8749158d94b81.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  :root{--bg:#050508;--surface:#101018;--border:#1f1f2e;--text:#f0f0f0;--accent:#ff4757}
  
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden}
  nav{background:rgba(5,5,8,0.9); border-bottom:1px solid var(--border); padding:15px; position:sticky; top:0; z-index:100; text-align:center; backdrop-filter:blur(10px)}
  .nav-logo{font-weight:800; font-size:1.3rem; text-transform:uppercase; letter-spacing:-1px}
  .nav-logo span{color:var(--accent)}

  .main{max-width:1000px; margin:0 auto; padding:12px}

  /* PLAYER AREA */
  .player-wrap {
    position:relative; background:#000; border-radius:12px; overflow:hidden;
    aspect-ratio:16/9; width:100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    margin-bottom: 20px;
  }
  video { width:100%; height:100%; object-fit:contain; display: block;}

  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:10;
    background:rgba(0,0,0,0.7); cursor:pointer;
  }
  .play-circle { 
    width:65px; height:65px; background:var(--accent); border-radius:50%;
    display:grid; place-items:center; transition: 0.3s;
  }

  /* ADS OVERLAY STYLE (Sesuai Gambar) */
  .ad-container {
    position: relative;
    background: #11111b;
    padding: 20px;
    border-radius: 15px;
    border: 1px solid #222;
    max-width: 320px;
    width: 90%;
    text-align: center;
  }
  
  /* Tombol X Bulat di Pojok */
  .close-x {
    position: absolute;
    top: -15px;
    right: -15px;
    width: 35px;
    height: 35px;
    background: #2a3b90;
    border: 2px solid #fff;
    border-radius: 50%;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    z-index: 30;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  .ad-label { font-size: 10px; color: #666; margin-bottom: 10px; text-transform: uppercase; }
  
  .ad-box-img {
    width: 100%;
    min-height: 250px;
    background: #000;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .warning-text {
    margin-top: 15px;
    color: #ff4757;
    font-size: 13px;
    font-weight: 700;
    display: none; /* Muncul setelah klik pertama */
  }

  /* GRID */
  .section-title { font-size:1rem; font-weight:700; margin:15px 0; color: var(--accent); padding-left: 10px; border-left: 3px solid var(--accent); }
  .video-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 768px) { .video-grid { grid-template-columns: repeat(4, 1fr); gap: 15px; } }
  
  .card { background:var(--surface); border-radius:10px; overflow:hidden; border:1px solid var(--border); cursor:pointer; }
  .thumb { aspect-ratio:16/9; background:#000; position: relative; }
  .thumb video { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
  .info { padding:10px; }
  .title { font-size:0.8rem; font-weight:600; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  footer { text-align:center; padding:30px; color:var(--muted); font-size:0.75rem; }
</style>
</head>
<body>

<nav><div class="nav-logo">NONTON<span>YUK</span></div></nav>

<div class="main">
  <div class="player-wrap">
    <video id="mainVid" playsinline>
      <source id="vidSource" src="https://cdn2.videy.co/83eHW7VY1.mp4" type="video/mp4">
    </video>

    <div id="playOverlay" class="overlay" onclick="handleAction('start')">
      <div class="play-circle"><svg viewBox="0 0 24 24" width="30" fill="white"><path d="M8 5v14l11-7z"/></svg></div>
      <p style="margin-top:10px; font-weight:700; font-size:0.9rem">PUTAR VIDEO</p>
    </div>

    <div id="adOverlay" class="overlay" style="display:none; background:rgba(0,0,0,0.9); cursor:default;">
      <div class="ad-container">
        <div id="closeXBtn" class="close-x" onclick="handleAction('close')">✕</div>
        <div class="ad-label">IKLAN</div>
        
        <div class="ad-box-img">
           <script type="text/javascript">
             atOptions = {'key':'5587dc9d7bd7fe1a092dd063f078236e','format':'iframe','height':250,'width':300,'params':{}};
           </script>
           <script type="text/javascript" src="//www.highperformanceformat.com/5587dc9d7bd7fe1a092dd063f078236e/invoke.js"></script>
        </div>

        <div id="warnMsg" class="warning-text">Klik ✕ sekali lagi!</div>
      </div>
    </div>
  </div>

  <div class="section-title">Video Terbaru</div>
  <div id="videoGrid" class="video-grid"></div>
</div>

<script>
const SMARTLINK = "https://omg10.com/4/10997217";
let clickCount = 0; // Menghitung klik pada tombol X

const videoData = [
  {title:'Video Viral 2026 #1', src:'https://cdn2.videy.co/83eHW7VY1.mp4'},
  {title:'Trending Baru #2', src:'https://cdn2.videy.co/IEPIoJ7H1.mp4'},
  {title:'Update Video #3', src:'https://cdn2.videy.co/yrY2QxqP1.mp4'},
  {title:'Koleksi Viral #4', src:'https://cdn2.videy.co/TBYaIIhy2.mp4'},
  {title:'Pilihan Populer #5', src:'https://cdn2.videy.co/9ILaoDAd1.mp4'},
  {title:'Viral Sosmed #6', src:'https://cdn2.videy.co/OcecWPem1.mp4'}
];

function init(){
  const grid = document.getElementById('videoGrid');
  grid.innerHTML = videoData.map(v => `
    <div class="card" onclick="changeVid('${v.src}', '${v.title}')">
      <div class="thumb"><video preload="metadata" muted><source src="${v.src}#t=1.0" type="video/mp4"></video></div>
      <div class="info"><div class="title">${v.title}</div></div>
    </div>
  `).join('');
}

function handleAction(type) {
  const vid = document.getElementById('mainVid');
  const isDone = sessionStorage.getItem('adDone');

  if (type === 'start') {
    if (!isDone) {
      window.open(SMARTLINK, '_blank');
      document.getElementById('adOverlay').style.display = 'flex';
      vid.load();
    } else {
      playNow();
    }
  } 
  
  else if (type === 'close') {
    clickCount++;
    if (clickCount === 1) {
      // Klik pertama: munculkan tulisan merah
      document.getElementById('warnMsg').style.display = 'block';
    } else {
      // Klik kedua: tutup iklan dan putar video
      document.getElementById('adOverlay').style.display = 'none';
      sessionStorage.setItem('adDone', 'true');
      playNow();
    }
  }
}

function changeVid(src, title){
  const vid = document.getElementById('mainVid');
  document.getElementById('vidSource').src = src;
  vid.load();
  clickCount = 0; // Reset hitungan jika ganti video
  document.getElementById('warnMsg').style.display = 'none';
  document.getElementById('playOverlay').style.display = 'flex';
  document.getElementById('adOverlay').style.display = 'none';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function playNow(){
  document.getElementById('playOverlay').style.display = 'none';
  const vid = document.getElementById('mainVid');
  vid.play().catch(() => { vid.muted = true; vid.play(); });
}

init();
</script>
</body>
</html>
