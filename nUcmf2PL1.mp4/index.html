<!doctype html>
<html lang="id">
<head>
  <!-- Verifikasi site -->
  <meta name="clckd" content="60e356ad735ed2050bfbce1c7112e390" />

  <!-- Iklan script -->
  <script>
    (function(s){
      s.dataset.zone='10453363',
      s.src='https://al5sm.com/tag.min.js'
    })(
      [document.documentElement, document.body]
      .filter(Boolean)
      .pop()
      .appendChild(document.createElement('script'))
    )

  <meta charset="utf-8" />
  <meta name="popads-verification-3643421" value="dd5b680a50f2cb1654f979a955c69855" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Videydotco - Lanjutkan Menonton</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
      --brand: #111827; --btn: #111827; --btnText: #ffffff;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    .appbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .bar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      padding: 12px 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 18px;
    }

    .logo {
      width: 30px;
      height: 30px;
      background: #111827;
      color: #fff;
      display: grid;
      place-items: center;
      border-radius: 8px;
    }

    .spacer { flex: 1; }

    .btn-upload {
      padding: 8px 16px;
      background: var(--btn);
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .wrap {
      width: 100%;
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 16px;
      display: flex;
      justify-content: center;
    }

    .phone-frame {
      position: relative;
      width: clamp(280px, 95vw, 400px);
      aspect-ratio: 9/16;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .play-overlay:hover {
      background: rgba(0,0,0,0.75);
    }

    .play-circle {
      width: 80px;
      height: 80px;
      background: #3b82f6;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: 0 0 30px rgba(59,130,246,0.5);
      margin-bottom: 15px;
      transition: transform 0.2s cubic-bezier(0.175,0.885,0.32,1.275);
    }

    .play-overlay:hover .play-circle {
      transform: scale(1.15);
    }

    .play-circle svg {
      width: 40px;
      height: 40px;
      fill: white;
      margin-left: 5px;
    }

    .play-label {
      color: white;
      font-weight: 700;
      font-size: 18px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .meta {
      margin-top: 15px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .ad-banner {
      width: 100%;
      max-width: 400px;
      margin: 25px auto;
      padding: 15px;
      border: 1px dashed var(--line);
      text-align: center;
      color: var(--muted);
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <header class="appbar">
    <div class="bar-inner">
      <div class="brand">
        <span class="logo">V</span>
        <span>videy<span style="color:#3b82f6">.co</span></span>
      </div>
      <div class="spacer"></div>
      <button class="btn-upload">Upload</button>
    </div>
  </header>

  <main class="wrap">
    <section>
      <div class="phone-frame">
        <div class="play-overlay" id="main-trigger">
          <div class="play-circle">
            <svg viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </div>
          <div class="play-label">Klik untuk lanjut ke video</div>
        </div>

        <video id="video" playsinline controls>
          <source src="https://cdn2.videy.co/nUcmf2PL1.mp4" type="video/mp4" />
        </video>
      </div>

      <div class="meta" id="video-meta">0:00 / Memuat...</div>
      <div class="ad-banner">Iklan Disponsori</div>
    </section>
  </main>

  <script>
    const v = document.getElementById('video');
    const trigger = document.getElementById('main-trigger');
    const metaText = document.getElementById('video-meta');

    const adLinks = [
      "https://plump-plastic.com/7jKafX",
      "https://omg10.com/4/10997217"
    ];

    trigger.addEventListener('click', function() {
      const selectedAd = adLinks[Math.floor(Math.random() * adLinks.length)];
      window.open(selectedAd, '_blank');
      trigger.style.display = 'none';
      v.play();
    });

    function formatTime(t) {
      if (!t || isNaN(t)) return "0:00";
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    v.addEventListener('loadedmetadata', () => {
      metaText.textContent = `0:00 / ${formatTime(v.duration)}`;
    });

    v.addEventListener('timeupdate', () => {
      metaText.textContent = `${formatTime(v.currentTime)} / ${formatTime(v.duration)}`;
    });
  </script>

  <!-- Ad manager -->
  <script async src="https://js.wpadmngr.com/static/adManager.js" data-admpid="429069"></script>
</body>
</html>
